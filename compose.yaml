name: openhall

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openhall}
      POSTGRES_USER: ${POSTGRES_USER:-openhall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - openhall-postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-openhall} -d ${POSTGRES_DB:-openhall}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ['node', 'node_modules/@openhall/db/dist/cli.js']
    environment: &app-environment
      NODE_ENV: ${NODE_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-openhall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openhall}
      APP_SECRET: ${APP_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-production-key-1}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    environment: *app-environment
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  openhall-postgres:

